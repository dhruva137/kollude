[project]
name = "kollude"
version = "0.4.0"
description = "Detect coordinated agent swarms, trace who spread a shared line, and alarm only when multiplicity and copying both show up."
readme = "PYPI.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Dhruva P Gowda" }]
keywords = ["multi-agent", "swarm", "collusion", "forensics", "mcp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "scikit-learn>=1.4",
  "httpx>=0.27",
  "huggingface-hub>=0.26",
  "ijson>=3.3",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "mcp>=1.8",
  "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.urls]
Homepage = "https://papertoanything.com/products/kollude/"
Repository = "https://github.com/dhruva137/kollude"
Documentation = "https://github.com/dhruva137/kollude#readme"

[project.scripts]
kollude = "kollude.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["kollude"]

[tool.hatch.build.targets.wheel.force-include]
"kollude/bundled/ep001.json" = "kollude/bundled/ep001.json"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001", "S110", "S112"]

[tool.ruff.lint.per-file-ignores]
"kollude/cli.py" = ["B008"]
"kollude/server.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
