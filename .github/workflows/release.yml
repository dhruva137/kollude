# Publish kollude to PyPI via Trusted Publishing (no long-lived API token).
# PyPI side (Trusted Publisher): owner dhruva137, repository kollude, workflow release.yml, environment pypi.
# Trigger: GitHub Release published.
name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  pypi:
    name: build and publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install -U pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
